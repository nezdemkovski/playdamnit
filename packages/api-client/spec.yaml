openapi: 3.0.3
info:
  title: Your API
  description: Development documentation
  version: 1.0.0
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token

  schemas:
    BadRequestErrorResponse:
      description: 400 Bad request
      type: object
      properties:
        error:
          type: string
          enum:
            - Bad request
      required:
        - error

    UnauthorizedErrorResponse:
      description: 401 Unauthorized
      type: object
      properties:
        error:
          type: string
          enum:
            - Unauthorized
        message:
          type: string
          enum:
            - Authentication required
      required:
        - error
        - message

    ForbiddenErrorResponse:
      description: 403 Forbidden
      type: object
      properties:
        error:
          type: string
          enum:
            - Forbidden
        message:
          type: string
          description: Human readable error message
      required:
        - error

    NotFoundErrorResponse:
      description: 404 Not found
      type: object
      properties:
        error:
          type: string
          enum:
            - Not found
        message:
          type: string
          description: Human readable error message
      required:
        - error

    ConflictErrorResponse:
      description: 409 Conflict
      type: object
      properties:
        error:
          type: string
          enum:
            - Conflict
        message:
          type: string
          description: Human readable error message
      required:
        - error

    InternalServerErrorResponse:
      description: 500 Internal server error
      type: object
      properties:
        error:
          type: string
          enum:
            - Internal server error
        message:
          type: string
          description: Human readable error message
      required:
        - error

    ChatRole:
      type: string
      enum:
        - user
        - assistant
        - system
        - function

    UserGameDeleteResponse:
      allOf:
        - $ref: "#/components/schemas/DeleteSuccessResponse"
        - type: object
          properties:
            community:
              $ref: "#/components/schemas/GameCommunity"

    DeleteSuccessResponse:
      type: object
      properties:
        message:
          type: string
          enum:
            - Removed successfully
        id:
          type: number
      required:
        - message
        - id

    GameCover:
      type: object
      properties:
        id:
          type: number
        url:
          type: string
          nullable: true
        width:
          type: number
          nullable: true
        height:
          type: number
          nullable: true
      description: "A game without a cover comes back as { url: null }, without an id"
      required:
        - url

    GameGenre:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        slug:
          type: string
      required:
        - id
        - name
        - slug

    GameListResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/Game"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - results
        - meta

    GamePlatform:
      type: object
      description: A platform from the IGDB catalog; `id` is the IGDB platform id.
      properties:
        id:
          type: number
        name:
          type: string
        slug:
          type: string
        abbreviation:
          type: string
          nullable: true
      required:
        - id
        - name
        - slug

    Game:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        slug:
          type: string
        summary:
          type: string
          nullable: true
        storyline:
          type: string
          nullable: true
        firstReleaseDate:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        totalRating:
          type: number
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        isPopular:
          type: boolean
        cover:
          $ref: "#/components/schemas/GameCover"
        screenshots:
          type: array
          description: Only present on GET /api/games/{id}
          items:
            $ref: "#/components/schemas/GameScreenshot"
        websites:
          type: array
          items:
            $ref: "#/components/schemas/GameWebsite"
        platforms:
          type: array
          items:
            $ref: "#/components/schemas/GamePlatform"
        genres:
          type: array
          items:
            $ref: "#/components/schemas/GameGenre"
        types:
          type: array
          items:
            $ref: "#/components/schemas/GameType"
        similarGames:
          type: array
          description: Only present on GET /api/games/{id}; cards of IGDB's similar games
          items:
            $ref: "#/components/schemas/GameRelated"
        community:
          description: Only present on GET /api/games/{id}; what members did with the game
          allOf:
            - $ref: "#/components/schemas/GameCommunity"
        viewer:
          description: Only present on GET /api/games/{id}
          type: object
          properties:
            liked:
              type: boolean
          required:
            - liked
        totalRatingCount:
          type: number
          nullable: true
        firstReleaseDatePrecision:
          type: string
          nullable: true
          enum: [day, month, year, quarter, tbd, null]
          description: How precise the release date is
        gameType:
          type: number
          nullable: true
          description: IGDB game_type id (0 = Main Game, 1 = DLC, 8 = Remake, 9 = Remaster, ...)
        parentGameId:
          type: number
          nullable: true
          description: For DLC, expansions, updates and bundles, the game they belong to
        versionParentId:
          type: number
          nullable: true
          description: For editions (Deluxe, GOTY, ...), the game they are a version of
        alternativeNames:
          type: array
          items:
            type: string
        deleted:
          type: boolean
          description: IGDB no longer has this game; it stays because libraries reference it
        developers:
          type: array
          description: Only present on GET /api/games/{id}
          items:
            $ref: "#/components/schemas/GameCompany"
        publishers:
          type: array
          description: Only present on GET /api/games/{id}
          items:
            $ref: "#/components/schemas/GameCompany"
        videos:
          type: array
          description: Only present on GET /api/games/{id}
          items:
            $ref: "#/components/schemas/GameVideo"
        externalGames:
          type: array
          description: Only present on GET /api/games/{id}; store and service listings
          items:
            $ref: "#/components/schemas/GameExternalGame"
        collections:
          type: array
          description: Only present on GET /api/games/{id}; series the game belongs to
          items:
            $ref: "#/components/schemas/GameNamed"
        themes:
          type: array
          description: Only present on GET /api/games/{id}
          items:
            $ref: "#/components/schemas/GameNamed"
        gameModes:
          type: array
          description: Only present on GET /api/games/{id}
          items:
            $ref: "#/components/schemas/GameNamed"
        timeToBeat:
          description: Only present on GET /api/games/{id}; seconds
          nullable: true
          allOf:
            - $ref: "#/components/schemas/GameTimeToBeat"
        localizedCovers:
          type: array
          description: Only present on GET /api/games/{id}
          items:
            $ref: "#/components/schemas/GameLocalizedCover"
        children:
          type: array
          description: Only present on GET /api/games/{id}; DLC, expansions, updates, bundles
          items:
            $ref: "#/components/schemas/GameRelated"
        editions:
          type: array
          description: Only present on GET /api/games/{id}; Deluxe / GOTY / regional versions
          items:
            $ref: "#/components/schemas/GameRelated"
      required:
        - id
        - name
        - slug
        - isPopular
        - cover
        - platforms
        - genres
        - types
        - alternativeNames
        - deleted
      description: >-
        screenshots, websites, similarGames, developers, publishers, videos, externalGames,
        collections, themes, gameModes, timeToBeat, localizedCovers, children and editions are
        only included by GET /api/games/{id}; list endpoints (search, catalog, library) omit
        them. Search hides deleted games and editions unless asked for.

    GameNamed:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        slug:
          type: string
      required:
        - id
        - name
        - slug

    GameCompany:
      $ref: "#/components/schemas/GameNamed"

    GameVideo:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
          nullable: true
        videoId:
          type: string
          description: YouTube video id
        url:
          type: string
      required:
        - id
        - videoId
        - url

    GameExternalGame:
      type: object
      properties:
        id:
          type: number
        source:
          type: string
          nullable: true
          description: Steam, GOG, Epic Games Store, ...
        name:
          type: string
          nullable: true
        uid:
          type: string
          nullable: true
          description: The game's id in that store
        url:
          type: string
          nullable: true
      required:
        - id

    GameTimeToBeat:
      type: object
      properties:
        hastily:
          type: number
          nullable: true
        normally:
          type: number
          nullable: true
        completely:
          type: number
          nullable: true
        count:
          type: number
          nullable: true

    GameLocalizedCover:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
          nullable: true
        regionId:
          type: number
          nullable: true
        url:
          type: string
        width:
          type: number
          nullable: true
        height:
          type: number
          nullable: true
      required:
        - id
        - url

    GameRelated:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        slug:
          type: string
        gameType:
          type: number
          nullable: true
        firstReleaseDate:
          type: number
          nullable: true
        cover:
          $ref: "#/components/schemas/GameCover"
      required:
        - id
        - name
        - slug
        - cover

    GameScreenshot:
      type: object
      properties:
        id:
          type: number
        url:
          type: string
          nullable: true
        width:
          type: number
          nullable: true
        height:
          type: number
          nullable: true
      required:
        - id
        - url

    GameCommunity:
      type: object
      properties:
        total:
          type: number
          description: Members with the game in their list
        statuses:
          type: object
          additionalProperties:
            type: number
          description: Count per status
        mastered:
          type: number
        ratingAverage:
          type: number
          nullable: true
        ratingCount:
          type: number
        histogram:
          type: array
          description: Ratings bucketed by whole number (floor), 1..10
          items:
            type: number
        reviews:
          type: number
        likes:
          type: number
        lists:
          type: number
          description: Public lists containing the game
      required:
        - total
        - statuses
        - mastered
        - ratingAverage
        - ratingCount
        - histogram
        - reviews
        - likes
        - lists

    PublicUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
          nullable: true
        name:
          type: string
        image:
          type: string
          nullable: true
      required:
        - id
        - username
        - name
        - image

    Review:
      type: object
      description: A library entry with text; `id` is the entry id used for likes
      properties:
        id:
          type: string
        gameId:
          type: number
        user:
          $ref: "#/components/schemas/PublicUser"
        rating:
          type: number
          nullable: true
        status:
          $ref: "#/components/schemas/StatusEnum"
        mastered:
          type: boolean
        spoilers:
          type: boolean
        review:
          type: string
        platformId:
          type: number
          nullable: true
        endedAt:
          type: string
          nullable: true
        addedAt:
          type: string
        updatedAt:
          type: string
        allowReactions:
          type: boolean
        likes:
          type: number
          description: Total reactions
        reactions:
          type: array
          description: Per-emoji counts, most used first
          items:
            type: object
            properties:
              emoji:
                type: string
              count:
                type: number
            required:
              - emoji
              - count
        myReaction:
          type: string
          nullable: true
          description: The viewer's own emoji on this review
        game:
          description: Present on feeds (not on a game's own reviews)
          allOf:
            - $ref: "#/components/schemas/Game"
      required:
        - id
        - gameId
        - user
        - rating
        - status
        - mastered
        - spoilers
        - review
        - platformId
        - endedAt
        - addedAt
        - updatedAt
        - allowReactions
        - likes
        - reactions
        - myReaction

    ReviewListResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - results
        - meta

    LikeResponse:
      type: object
      properties:
        liked:
          type: boolean
      required:
        - liked

    ReactionResponse:
      type: object
      properties:
        reaction:
          type: string
          nullable: true
      required:
        - reaction

    FollowResponse:
      type: object
      properties:
        following:
          type: boolean
      required:
        - following

    CommunityUser:
      allOf:
        - $ref: "#/components/schemas/PublicUser"
        - type: object
          properties:
            bio:
              type: string
              nullable: true
            gamesCount:
              type: number
            followersCount:
              type: number
            isFollowing:
              type: boolean
          required:
            - gamesCount
            - followersCount
            - isFollowing

    CommunityUserListResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/CommunityUser"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - results
        - meta

    ConnectionUser:
      allOf:
        - $ref: "#/components/schemas/PublicUser"
        - type: object
          properties:
            isFollowing:
              type: boolean
          required:
            - isFollowing

    ConnectionListResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ConnectionUser"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - results
        - meta

    ProfileUpdateRequest:
      type: object
      properties:
        bio:
          type: string
          nullable: true
          maxLength: 300
        links:
          type: array
          maxItems: 5
          items:
            type: string
        listPublic:
          type: boolean

    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [follow, review_reaction]
        actor:
          $ref: "#/components/schemas/PublicUser"
        game:
          nullable: true
          type: object
          properties:
            id:
              type: number
            name:
              type: string
            slug:
              type: string
            cover:
              $ref: "#/components/schemas/GameCover"
          required:
            - id
            - name
            - slug
            - cover
        emoji:
          type: string
          nullable: true
        readAt:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - type
        - actor
        - game
        - emoji
        - readAt
        - createdAt

    NotificationListResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        unread:
          type: number
      required:
        - results
        - unread

    FeedItem:
      type: object
      description: A list entry a followed member added or changed
      properties:
        id:
          type: string
        user:
          $ref: "#/components/schemas/PublicUser"
        game:
          $ref: "#/components/schemas/Game"
        status:
          $ref: "#/components/schemas/StatusEnum"
        rating:
          type: number
          nullable: true
        mastered:
          type: boolean
        hasReview:
          type: boolean
        at:
          type: string
        isNew:
          type: boolean
          description: Added rather than changed
      required:
        - id
        - user
        - game
        - status
        - rating
        - mastered
        - hasReview
        - at
        - isNew

    FeedResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/FeedItem"
      required:
        - results

    Playthrough:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        gameId:
          type: number
        startedAt:
          type: string
          nullable: true
          description: YYYY-MM-DD
        endedAt:
          type: string
          nullable: true
          description: YYYY-MM-DD
        hours:
          type: number
          nullable: true
        platformId:
          type: number
          nullable: true
        platform:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/GamePlatform"
        note:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - userId
        - gameId
        - startedAt
        - endedAt
        - hours
        - platformId
        - note
        - createdAt

    PlaythroughInput:
      type: object
      properties:
        startedAt:
          type: string
          nullable: true
        endedAt:
          type: string
          nullable: true
        hours:
          type: number
          nullable: true
        platformId:
          type: number
          nullable: true
        note:
          type: string
          nullable: true

    JournalItem:
      type: object
      description: A playthrough, or a finished/dropped entry that has no playthrough logged
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [playthrough, entry]
        date:
          type: string
          description: YYYY-MM-DD, what the journal is ordered by
        startedAt:
          type: string
          nullable: true
        endedAt:
          type: string
          nullable: true
        hours:
          type: number
          nullable: true
        platform:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/GamePlatform"
        note:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/StatusEnum"
        rating:
          type: number
          nullable: true
        mastered:
          type: boolean
        game:
          $ref: "#/components/schemas/Game"
      required:
        - id
        - kind
        - date
        - startedAt
        - endedAt
        - hours
        - platform
        - note
        - game

    JournalResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/JournalItem"
        private:
          type: boolean
      required:
        - results
        - private

    ReleaseDaysResponse:
      type: object
      properties:
        days:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                description: UTC day, YYYY-MM-DD
              count:
                type: number
            required:
              - date
              - count
      required:
        - days

    GameListSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        isPublic:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
        user:
          $ref: "#/components/schemas/PublicUser"
        gamesCount:
          type: number
        covers:
          type: array
          description: The first few covers, for the list card
          items:
            $ref: "#/components/schemas/GameCover"
      required:
        - id
        - name
        - description
        - isPublic
        - createdAt
        - updatedAt
        - gamesCount
        - covers

    GameListDetail:
      allOf:
        - $ref: "#/components/schemas/GameListSummary"
        - type: object
          properties:
            games:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/Game"
                  - type: object
                    properties:
                      position:
                        type: number
                      note:
                        type: string
                        nullable: true
                    required:
                      - position
                      - note
          required:
            - games

    GameListInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 1000
        isPublic:
          type: boolean

    GameListMembership:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        isPublic:
          type: boolean
        contains:
          type: boolean
      required:
        - id
        - name
        - isPublic
        - contains

    CatalogLookups:
      type: object
      properties:
        genres:
          type: array
          items:
            $ref: "#/components/schemas/GameGenre"
        platforms:
          type: array
          items:
            $ref: "#/components/schemas/GamePlatform"
        localPlatforms:
          type: array
          description: >-
            Platforms IGDB lacks (Steam Deck, Steam Machine, Steam Frame): selectable for a library
            entry or playthrough, but no catalog game lists them
          items:
            $ref: "#/components/schemas/GamePlatform"
        types:
          type: array
          items:
            $ref: "#/components/schemas/GameType"
      required:
        - genres
        - platforms
        - localPlatforms
        - types

    LikedGameListResponse:
      type: object
      properties:
        results:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Game"
              - type: object
                properties:
                  likedAt:
                    type: string
                required:
                  - likedAt
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - results
        - meta

    GameType:
      type: object
      properties:
        id:
          type: number
        type:
          type: string
      required:
        - id
        - type

    GameWebsite:
      type: object
      properties:
        id:
          type: number
        url:
          type: string
        type:
          type: string
          nullable: true
          description: Official Website, Steam, Discord, ...
        trusted:
          type: boolean
        typeId:
          type: number
      required:
        - id
        - url

    Meta:
      type: object
      properties:
        total:
          type: number
        limit:
          type: number
        offset:
          type: number
      required:
        - total
        - limit
        - offset

    StatusEnum:
      type: string
      enum:
        - finished
        - playing
        - dropped
        - online
        - on_hold
        - want_to_play
        - backlog

    UserGameData:
      type: object
      properties:
        id:
          type: string
          description: Entry id (the review id for likes)
        status:
          $ref: "#/components/schemas/StatusEnum"
        rating:
          type: number
          nullable: true
        review:
          type: string
          nullable: true
        platformId:
          type: number
        addedAt:
          type: string
          nullable: true
        endedAt:
          type: string
          nullable: true
          description: Date when the game was finished or dropped. Only applicable for games with status 'finished' or 'dropped'.
        source:
          type: string
          enum:
            - steam
            - gog
            - manual
        mastered:
          type: boolean
        spoilers:
          type: boolean
        allowReactions:
          type: boolean
        steamMinutes:
          type: number
          nullable: true
          description: Playtime on the linked Steam account at the last sync
        steamLastPlayedAt:
          type: string
          nullable: true
          description: When Steam last saw the game launched
        updatedAt:
          type: string
      required:
        - id
        - status
        - rating
        - platformId
        - addedAt
        - mastered
        - spoilers
        - allowReactions
        - updatedAt

    UserGamePatchResponse:
      type: object
      properties:
        message:
          type: string
          enum:
            - Game updated successfully
        entry:
          allOf:
            - $ref: "#/components/schemas/UserGameWithUserData"
          description: The updated entry as the library list serves it
        community:
          allOf:
            - $ref: "#/components/schemas/GameCommunity"
          description: The game's member numbers after the change
        game:
          type: object
          properties:
            userId:
              type: string
            gameId:
              type: number
            status:
              $ref: "#/components/schemas/StatusEnum"
            rating:
              type: number
              nullable: true
            review:
              type: string
              nullable: true
            platformId:
              type: number
              default: 0
            source:
              type: string
            addedAt:
              type: string
              nullable: true
          required:
            - userId
            - gameId
            - status
            - rating
            - review
            - platformId
            - source
            - addedAt
      required:
        - message
        - game

    UserGameResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/UserGameWithUserData"
        meta:
          type: object
          properties:
            total:
              type: number
          required:
            - total
      required:
        - results
        - meta

    UserGameWithUserData:
      allOf:
        - $ref: "#/components/schemas/Game"
        - type: object
          properties:
            userGameData:
              $ref: "#/components/schemas/UserGameData"
          required:
            - userGameData

    UserResponse:
      type: object
      properties:
        id:
          type: string
        image:
          type: string
          nullable: true
        name:
          type: string
        username:
          type: string
          nullable: true
        email:
          type: string
        bio:
          type: string
          nullable: true
        links:
          type: array
          items:
            type: string
        listPublic:
          type: boolean
      required:
        - id
        - image
        - name
        - username
        - email
        - bio
        - links
        - listPublic

    PublicUserResponse:
      type: object
      properties:
        id:
          type: string
        image:
          type: string
          nullable: true
        name:
          type: string
        username:
          type: string
        bio:
          type: string
          nullable: true
        links:
          type: array
          items:
            type: string
        listPublic:
          type: boolean
        createdAt:
          type: string
        counts:
          type: object
          properties:
            games:
              type: number
            followers:
              type: number
            following:
              type: number
            reviews:
              type: number
            lists:
              type: number
          required:
            - games
            - followers
            - following
            - reviews
            - lists
        isFollowing:
          type: boolean
        followsYou:
          type: boolean
        isOwn:
          type: boolean
        steamLinked:
          type: boolean
          description: Whether a Steam account is connected (its library syncs on its own)
        steamName:
          type: string
          nullable: true
          description: The connected Steam profile's display name
        steamProfileUrl:
          type: string
          nullable: true
          description: The connected Steam profile's page
        steamAvatarUrl:
          type: string
          nullable: true
          description: The connected Steam profile's avatar (64 px)
        steamId:
          type: string
          nullable: true
          description: The linked SteamID64; only the owner sees it
        steamSyncedAt:
          type: string
          nullable: true
          description: When the linked Steam library was last imported; only the owner sees it
      required:
        - id
        - image
        - name
        - username
        - bio
        - links
        - listPublic
        - createdAt
        - counts
        - isFollowing
        - followsYou
        - isOwn

    UserGameCreateRequest:
      type: object
      properties:
        gameId:
          type: number
        status:
          $ref: "#/components/schemas/StatusEnum"
        rating:
          type: number
          minimum: 0
          maximum: 10
        review:
          type: string
          minLength: 3
          maxLength: 5000
          nullable: true
        platformId:
          type: number
        endedAt:
          type: string
          nullable: true
          description: Date when the game was finished or dropped. Only applicable for games with status 'finished' or 'dropped'.
        mastered:
          type: boolean
        spoilers:
          type: boolean
        allowReactions:
          type: boolean
      required:
        - gameId
        - status
        - rating
        - platformId

    UserGameUpdateRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/StatusEnum"
        rating:
          type: number
          minimum: 0
          maximum: 10
          nullable: true
        review:
          type: string
          nullable: true
        platformId:
          type: number
        endedAt:
          type: string
          nullable: true
          description: Date when the game was finished or dropped. Only applicable for games with status 'finished' or 'dropped'.
        mastered:
          type: boolean
        spoilers:
          type: boolean
        allowReactions:
          type: boolean
      minProperties: 1

    ChatRequest:
      type: object
      description: >-
        Chat history in the AI SDK UI message format (what useChat sends). Only "user" and
        "assistant" messages are accepted; the response is an AI SDK UI message stream (SSE).
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            properties:
              id:
                type: string
              role:
                type: string
                enum:
                  - user
                  - assistant
              parts:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                  required:
                    - type
                  additionalProperties: true
            required:
              - id
              - role
              - parts
        showOnlyGames:
          type: boolean
          default: true
          description: Only return main games, remakes, remasters and expanded games from searches
      required:
        - messages

    GameExportData:
      type: object
      properties:
        gameId:
          type: number
        gameName:
          type: string
        status:
          $ref: "#/components/schemas/StatusEnum"
        rating:
          type: number
          nullable: true
        review:
          type: string
          nullable: true
        platformId:
          type: number
        addedAt:
          type: string
          nullable: true
        endedAt:
          type: string
          nullable: true
        source:
          type: string
      required:
        - gameId
        - gameName
        - status
        - platformId

    GameExportResponse:
      type: object
      properties:
        username:
          type: string
        exportedAt:
          type: string
        totalGames:
          type: number
        games:
          type: array
          items:
            $ref: "#/components/schemas/GameExportData"
      required:
        - username
        - exportedAt
        - totalGames
        - games

    GameImportData:
      type: object
      properties:
        gameId:
          type: number
        status:
          $ref: "#/components/schemas/StatusEnum"
        rating:
          type: number
          minimum: 0
          maximum: 10
          nullable: true
        review:
          type: string
          nullable: true
        platformId:
          type: number
        endedAt:
          type: string
          nullable: true
      required:
        - gameId
        - status
        - platformId

    GameImportRequest:
      type: object
      properties:
        games:
          type: array
          items:
            $ref: "#/components/schemas/GameImportData"
        overwriteExisting:
          type: boolean
          default: false
          description: Whether to overwrite existing games in the library
      required:
        - games

    GameImportResponse:
      type: object
      properties:
        message:
          type: string
        imported:
          type: number
        skipped:
          type: number
        errors:
          type: number
        details:
          type: object
          properties:
            importedGames:
              type: array
              items:
                type: number
            skippedGames:
              type: array
              items:
                type: object
                properties:
                  gameId:
                    type: number
                  reason:
                    type: string
                required:
                  - gameId
                  - reason
            errorGames:
              type: array
              items:
                type: object
                properties:
                  gameId:
                    type: number
                  error:
                    type: string
                required:
                  - gameId
                  - error
          required:
            - importedGames
            - skippedGames
            - errorGames
      required:
        - message
        - imported
        - skipped
        - errors
        - details

paths:
  /api/me:
    patch:
      operationId: patchApiMe
      tags:
        - User
      summary: Update bio, links and list privacy
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponse"
    get:
      operationId: getApiMe
      tags:
        - User
      summary: Get current authenticated user
      description: Returns info about the currently authenticated user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: User data returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponse"

  /api/user/{username}:
    get:
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      operationId: getApiUserByUsername
      tags:
        - User
      summary: Get a user by username
      description: Returns public info about a user, by their username
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUserResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"

  /api/games:
    get:
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: number
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: number
            default: 0
        - name: platformId
          in: query
          required: false
          schema:
            type: number
            default: 0
        - name: genreId
          in: query
          required: false
          schema:
            type: number
        - name: year
          in: query
          required: false
          description: Release year
          schema:
            type: number
        - name: releasedFrom
          in: query
          required: false
          description: Unix seconds, inclusive
          schema:
            type: number
        - name: releasedTo
          in: query
          required: false
          description: Unix seconds, inclusive
          schema:
            type: number
        - name: types
          in: query
          required: false
          description: Comma-separated IGDB game_type ids to keep
          schema:
            type: string
        - name: ids
          in: query
          required: false
          description: Comma-separated game ids; results come back in catalog order
          schema:
            type: string
        - name: popular
          in: query
          required: false
          description: '"1" or "true" keeps only hot games: 100+ IGDB ratings, or 10+ follows before release'
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: >-
            id (catalog order, default), popular (IGDB rating count), rating (IGDB rating, games
            with enough votes), recent (released games with a cover, newest first), upcoming
            (unreleased games with a cover, soonest first), wanted (most wanted/backlogged by
            members), played (most members) or date (release calendar: dated games with a
            cover in date order, combine with releasedFrom/releasedTo)
          schema:
            type: string
            enum: [id, popular, rating, recent, upcoming, wanted, played, date]
      operationId: getApiGames
      tags:
        - Games
      summary: Get all games
      description: >
        Retrieves a list of games from the catalog. Supports filtering by
        platform and pagination.
      responses:
        "200":
          description: List of games with metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameListResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"

  /api/games/release-days:
    get:
      parameters:
        - name: releasedFrom
          in: query
          required: true
          description: Unix seconds, inclusive
          schema:
            type: number
        - name: releasedTo
          in: query
          required: true
          description: Unix seconds, inclusive
          schema:
            type: number
        - name: types
          in: query
          required: false
          description: Comma-separated IGDB game_type ids to keep
          schema:
            type: string
        - name: popular
          in: query
          required: false
          description: '"1" or "true" counts only hot games: 100+ IGDB ratings, or 10+ follows before release'
          schema:
            type: string
      operationId: getApiGamesReleaseDays
      tags:
        - Games
      summary: Releases per day
      description: How many games release on each UTC day of the range. Days without releases are left out.
      responses:
        "200":
          description: Counts per day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseDaysResponse"

  /api/games/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      operationId: getApiGamesById
      tags:
        - Games
      summary: Get a single game by ID
      description: Retrieves detailed information about a specific game by its ID.
      responses:
        "200":
          description: Game found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          description: Invalid game ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponse"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"

  /api/games/search:
    get:
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 100
          description: Search text; matched against the name and alternative names
        - name: limit
          in: query
          required: false
          schema:
            type: number
            default: 50
            minimum: 1
            maximum: 50
        - name: offset
          in: query
          required: false
          schema:
            type: number
            default: 0
            minimum: 0
        - name: editions
          in: query
          required: false
          schema:
            type: string
            enum: ["1", "true"]
          description: Also return editions (Deluxe, GOTY, ...), hidden by default
        - name: types
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated IGDB game_type ids to keep (0 = Main Game, 1 = DLC, 8 = Remake, ...)
      operationId: getApiGamesSearch
      tags:
        - Games
      summary: Search the catalog
      description: >-
        Local search over the IGDB mirror: substring or trigram word-similarity match on the
        name and alternative names, ranked by similarity, popularity and rating count. Deleted
        games are never returned. Rate limited per client.
      responses:
        "200":
          description: Matching games as light cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameListResponse"
        "400":
          description: Invalid search parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponse"
        "429":
          description: Too many searches from this client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponse"
  /api/user/{username}/games:
    get:
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size (max 1000). Omit to get the whole library.
          schema:
            type: number
        - name: offset
          in: query
          required: false
          schema:
            type: number
      operationId: getApiUserByUsernameGames
      tags:
        - User
      summary: Get all games for a user by username
      description: >
        Retrieves all games in a user's library with their statuses, ratings,
        and reviews
      responses:
        "200":
          description: List of games returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserGameResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"

    post:
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      operationId: postApiUserByUsernameGames
      tags:
        - User
      summary: Add a game to user's library
      description: >
        Adds a game to the authenticated user's library. Username must match the
        authorized user.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Game added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                      - Game added successfully
                  game:
                    type: object
                  entry:
                    allOf:
                      - $ref: "#/components/schemas/UserGameWithUserData"
                    description: The new entry as the library list serves it
                  community:
                    allOf:
                      - $ref: "#/components/schemas/GameCommunity"
                    description: The game's member numbers after the change
                required:
                  - message
                  - game
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponse"
        "403":
          description: Forbidden — username mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenErrorResponse"
        "409":
          description: Game already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserGameCreateRequest"

  /api/user/{username}/games/{id}:
    patch:
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: number
      operationId: patchApiUserByUsernameGamesById
      tags:
        - User
      summary: Update a game in user's library
      description: Updates game status, rating, review or platform in the authenticated user's library. At least one field must be provided.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Game updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserGamePatchResponse"
        "400":
          description: Invalid input or no fields provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponse"
        "403":
          description: Forbidden — username mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenErrorResponse"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserGameUpdateRequest"

    delete:
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: number
      operationId: deleteApiUserByUsernameGamesById
      tags:
        - User
      summary: Remove a game from user's library
      description: Removes a game from the authenticated user's library by game ID.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Game removed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserGameDeleteResponse"
        "404":
          description: Game not found in library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"

  /api/user/{username}/games/export:
    get:
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum:
              - json
              - csv
            default: json
          description: Export format (json or csv)
        - name: download
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Whether to return as downloadable file with proper headers
      operationId: getApiUserByUsernameGamesExport
      tags:
        - User
      summary: Export user's game library to downloadable file
      description: >
        Exports all games in the authenticated user's library as a downloadable file.
        Backend generates the file with proper Content-Disposition headers for download.
        Supports JSON and CSV formats. Username must match the authorized user.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Games exported successfully as downloadable file
          headers:
            Content-Disposition:
              description: Attachment header for file download
              schema:
                type: string
                example: 'attachment; filename="games-export-2024-01-15.json"'
            Content-Type:
              description: MIME type of the exported file
              schema:
                type: string
                example: "application/json"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameExportResponse"
            text/csv:
              schema:
                type: string
                description: CSV format of the exported games
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: Binary file download
        "403":
          description: Forbidden — username mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"

  /api/user/{username}/games/import:
    post:
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      operationId: postApiUserByUsernameGamesImport
      tags:
        - User
      summary: Import games to user's library from file upload
      description: >
        Imports games to the authenticated user's library from uploaded JSON or CSV file.
        Backend handles file parsing, validation, and processing. Username must match the
        authorized user. Can optionally overwrite existing games.
        Note: endedAt field is only valid for games with status 'finished' or 'dropped'.
        Limits: Maximum 1000 games per import, maximum file size 10MB.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Games imported successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameImportResponse"
        "400":
          description: Bad request - invalid import data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponse"
        "403":
          description: Forbidden — username mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameImportRequest"
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: JSON or CSV file containing games to import
                overwriteExisting:
                  type: boolean
                  default: false
                  description: Whether to overwrite existing games in the library

  /api/webhooks/igdb/{entity}/{method}:
    post:
      summary: IGDB webhook receiver
      description: |
        Called by IGDB, not by clients. The librarian registers these URLs with IGDB; IGDB posts
        the changed entity (only its id on delete) with the shared secret in `X-Secret`. The game
        the event is about is queued for a re-fetch.
      operationId: postIgdbWebhook
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
            enum:
              - games
              - covers
              - screenshots
              - videos
              - websites
              - external_games
              - game_localizations
              - involved_companies
        - name: method
          in: path
          required: true
          schema:
            type: string
            enum: [create, update, delete]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                id:
                  type: integer
                game:
                  type: integer
      responses:
        "200":
          description: Event acknowledged (gameId is null when it could not be resolved)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  gameId:
                    type: integer
                    nullable: true
                required:
                  - ok
                  - gameId
        "403":
          description: Bad or missing X-Secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenErrorResponse"
        "404":
          description: Webhooks are not configured on this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"

