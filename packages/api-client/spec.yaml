  /api/games/search:
    get:
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 100
          description: Search text; matched against the name and alternative names
        - name: limit
          in: query
          required: false
          schema:
            type: number
            default: 50
            minimum: 1
            maximum: 50
        - name: offset
          in: query
          required: false
          schema:
            type: number
            default: 0
            minimum: 0
        - name: editions
          in: query
          required: false
          schema:
            type: string
            enum: ["1", "true"]
          description: Also return editions (Deluxe, GOTY, ...), hidden by default
        - name: types
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated IGDB game_type ids to keep (0 = Main Game, 1 = DLC, 8 = Remake, ...)
      operationId: getApiGamesSearch
      tags:
        - Games
      summary: Search the catalog
      description: >-
        Local search over the IGDB mirror: substring or trigram word-similarity match on the
        name and alternative names, ranked by similarity, popularity and rating count. Deleted
        games are never returned. Rate limited per client.
      responses:
        "200":
          description: Matching games as light cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameListResponse"
        "400":
          description: Invalid search parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponse"
        "429":
          description: Too many searches from this client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponse"
  /api/user/{username}/games:
    get:
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size (max 1000). Omit to get the whole library.
          schema:
            type: number
        - name: offset
          in: query
          required: false
          schema:
            type: number
        - name: status
          in: query
          required: false
          description: Only entries with this status
          schema:
            $ref: "#/components/schemas/StatusEnum"
        - name: q
          in: query
          required: false
          description: Only games whose name or alternative names contain this
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Order of the list (default added, newest first)
          schema:
            $ref: "#/components/schemas/LibrarySortEnum"
      operationId: getApiUserByUsernameGames
      tags:
        - User
      summary: Get all games for a user by username
      description: >
        Retrieves all games in a user's library with their statuses, ratings,
        and reviews
      responses:
        "200":
          description: List of games returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserGameResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"

    post:
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      operationId: postApiUserByUsernameGames
      tags:
        - User
      summary: Add a game to user's library
      description: >
        Adds a game to the authenticated user's library. Username must match the
        authorized user.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Game added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                      - Game added successfully
                  game:
                    type: object
                  entry:
                    allOf:
                      - $ref: "#/components/schemas/UserGameWithUserData"
                    description: The new entry as the library list serves it
                  community:
                    allOf:
                      - $ref: "#/components/schemas/GameCommunity"
                    description: The game's member numbers after the change
                required:
                  - message
                  - game
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponse"
        "403":
          description: Forbidden — username mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenErrorResponse"
        "409":
          description: Game already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserGameCreateRequest"

  /api/user/{username}/games/index:
