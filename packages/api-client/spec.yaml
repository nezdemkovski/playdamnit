openapi: 3.1.1
info:
  title: Your API
  description: Development documentation
  version: 1.0.0
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token

  schemas:
    BadRequestErrorResponse:
      description: 400 Bad request
      type: object
      properties:
        error:
          type: string
          enum:
            - Bad request
      required:
        - error

    UnauthorizedErrorResponse:
      description: 401 Unauthorized
      type: object
      properties:
        error:
          type: string
          enum:
            - Unauthorized
        message:
          type: string
          enum:
            - Authentication required
      required:
        - error
        - message

    ForbiddenErrorResponse:
      description: 403 Forbidden
      type: object
      properties:
        error:
          type: string
          enum:
            - Forbidden
        message:
          type: string
          description: Human readable error message
      required:
        - error

    NotFoundErrorResponse:
      description: 404 Not found
      type: object
      properties:
        error:
          type: string
          enum:
            - Not found
        message:
          type: string
          description: Human readable error message
      required:
        - error

    ConflictErrorResponse:
      description: 409 Conflict
      type: object
      properties:
        error:
          type: string
          enum:
            - Conflict
        message:
          type: string
          description: Human readable error message
      required:
        - error

    InternalServerErrorResponse:
      description: 500 Internal server error
      type: object
      properties:
        error:
          type: string
          enum:
            - Internal server error
        message:
          type: string
          description: Human readable error message
      required:
        - error

    ChatRole:
      type: string
      enum:
        - user
        - assistant
        - system
        - function

    DeleteSuccessResponse:
      type: object
      properties:
        message:
          type: string
          enum:
            - Removed successfully
        id:
          type: number
      required:
        - message
        - id

    GameCover:
      type: object
      properties:
        id:
          type: number
        url:
          type: string
          nullable: true
        width:
          type: number
          nullable: true
        height:
          type: number
          nullable: true
      required:
        - id
        - url

    GameGenre:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        slug:
          type: string
      required:
        - id
        - name
        - slug

    GameListResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/Game"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - results
        - meta

    GamePlatform:
      type: object
      description: A platform from the IGDB catalog; `id` is the IGDB platform id.
      properties:
        id:
          type: number
        name:
          type: string
        slug:
          type: string
        abbreviation:
          type: string
          nullable: true
      required:
        - id
        - name
        - slug

    Game:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        slug:
          type: string
        summary:
          type: string
          nullable: true
        storyline:
          type: string
          nullable: true
        firstReleaseDate:
          type: number
          nullable: true
        createdAt:
          type: number
          nullable: true
        totalRating:
          type: number
          nullable: true
        updatedAt:
          type: number
          nullable: true
        isPopular:
          type: boolean
        cover:
          $ref: "#/components/schemas/GameCover"
        screenshots:
          type: array
          description: Only present on GET /api/games/{id}
          items:
            $ref: "#/components/schemas/GameScreenshot"
        websites:
          type: array
          items:
            $ref: "#/components/schemas/GameWebsite"
        platforms:
          type: array
          items:
            $ref: "#/components/schemas/GamePlatform"
        genres:
          type: array
          items:
            $ref: "#/components/schemas/GameGenre"
        types:
          type: array
          items:
            $ref: "#/components/schemas/GameType"
        similarGames:
          type: array
          items:
            $ref: "#/components/schemas/GameSimilarGame"
        totalRatingCount:
          type: number
          nullable: true
        firstReleaseDatePrecision:
          type: string
          nullable: true
          description: day, month, year, quarter or tbd
        gameType:
          type: number
          nullable: true
          description: IGDB game_type id (0 = Main Game, 1 = DLC, 8 = Remake, 9 = Remaster, ...)
        parentGameId:
          type: number
          nullable: true
          description: For DLC, expansions, updates and bundles, the game they belong to
        versionParentId:
          type: number
          nullable: true
          description: For editions (Deluxe, GOTY, ...), the game they are a version of
        alternativeNames:
          type: array
          items:
            type: string
        deleted:
          type: boolean
          description: IGDB no longer has this game; it stays because libraries reference it
        developers:
          type: array
          description: Only present on GET /api/games/{id}
          items:
            $ref: "#/components/schemas/GameCompany"
        publishers:
          type: array
          description: Only present on GET /api/games/{id}
          items:
            $ref: "#/components/schemas/GameCompany"
        videos:
          type: array
          description: Only present on GET /api/games/{id}
          items:
            $ref: "#/components/schemas/GameVideo"
        externalGames:
          type: array
          description: Only present on GET /api/games/{id}; store and service listings
          items:
            $ref: "#/components/schemas/GameExternalGame"
        collections:
          type: array
          description: Only present on GET /api/games/{id}; series the game belongs to
          items:
            $ref: "#/components/schemas/GameNamed"
        themes:
          type: array
          description: Only present on GET /api/games/{id}
          items:
            $ref: "#/components/schemas/GameNamed"
        gameModes:
          type: array
          description: Only present on GET /api/games/{id}
          items:
            $ref: "#/components/schemas/GameNamed"
        timeToBeat:
          description: Only present on GET /api/games/{id}; seconds
          nullable: true
          allOf:
            - $ref: "#/components/schemas/GameTimeToBeat"
        localizedCovers:
          type: array
          description: Only present on GET /api/games/{id}
          items:
            $ref: "#/components/schemas/GameLocalizedCover"
        children:
          type: array
          description: Only present on GET /api/games/{id}; DLC, expansions, updates, bundles
          items:
            $ref: "#/components/schemas/GameRelated"
        editions:
          type: array
          description: Only present on GET /api/games/{id}; Deluxe / GOTY / regional versions
          items:
            $ref: "#/components/schemas/GameRelated"
      required:
        - id
        - name
        - slug
        - isPopular
        - cover
        - platforms
        - genres
        - types
        - alternativeNames
        - deleted
      description: >-
        screenshots, websites, similarGames, developers, publishers, videos, externalGames,
        collections, themes, gameModes, timeToBeat, localizedCovers, children and editions are
        only included by GET /api/games/{id}; list endpoints (search, catalog, library) omit
        them. Search hides deleted games and editions unless asked for.

    GameNamed:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        slug:
          type: string
      required:
        - id
        - name
        - slug

    GameCompany:
      $ref: "#/components/schemas/GameNamed"

    GameVideo:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
          nullable: true
        videoId:
          type: string
          description: YouTube video id
        url:
          type: string
      required:
        - id
        - videoId
        - url

    GameExternalGame:
      type: object
      properties:
        id:
          type: number
        source:
          type: string
          nullable: true
          description: Steam, GOG, Epic Games Store, ...
        name:
          type: string
          nullable: true
        uid:
          type: string
          nullable: true
          description: The game's id in that store
        url:
          type: string
          nullable: true
      required:
        - id

    GameTimeToBeat:
      type: object
      properties:
        hastily:
          type: number
          nullable: true
        normally:
          type: number
          nullable: true
        completely:
          type: number
          nullable: true
        count:
          type: number
          nullable: true

    GameLocalizedCover:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
          nullable: true
        regionId:
          type: number
          nullable: true
        url:
          type: string
        width:
          type: number
          nullable: true
        height:
          type: number
          nullable: true
      required:
        - id
        - url

    GameRelated:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        slug:
          type: string
        gameType:
          type: number
          nullable: true
        firstReleaseDate:
          type: number
          nullable: true
        cover:
          $ref: "#/components/schemas/GameCover"
      required:
        - id
        - name
        - slug
        - cover

    GameScreenshot:
      type: object
      properties:
        id:
          type: number
        url:
          type: string
          nullable: true
        width:
          type: number
          nullable: true
        height:
          type: number
          nullable: true
      required:
        - id
        - url

    GameSimilarGame:
      type: object
      properties:
        id:
          type: number
      required:
        - id

    GameType:
      type: object
      properties:
        id:
          type: number
        type:
          type: string
      required:
        - id
        - type

    GameWebsite:
      type: object
      properties:
        id:
          type: number
        url:
          type: string
        type:
          type: string
          nullable: true
          description: Official Website, Steam, Discord, ...
        trusted:
          type: boolean
        typeId:
          type: number
      required:
        - id
        - url

    Meta:
      type: object
      properties:
        total:
          type: number
        limit:
          type: number
        offset:
          type: number
      required:
        - total
        - limit
        - offset

    StatusEnum:
      type: string
      enum:
        - finished
        - playing
        - dropped
        - online
        - on_hold
        - want_to_play
        - backlog

    UserGameData:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/StatusEnum"
        rating:
          type: number
          nullable: true
        review:
          type: string
          nullable: true
        platformId:
          type: number
        addedAt:
          type: string
          nullable: true
        endedAt:
          type: string
          nullable: true
          description: Date when the game was finished or dropped. Only applicable for games with status 'finished' or 'dropped'.
        source:
          type: string
          enum:
            - steam
            - gog
            - manual
      required:
        - status
        - rating
        - platformId
        - addedAt

    UserGamePatchResponse:
      type: object
      properties:
        message:
          type: string
          enum:
            - Game updated successfully
        game:
          type: object
          properties:
            userId:
              type: string
            gameId:
              type: number
            status:
              $ref: "#/components/schemas/StatusEnum"
            rating:
              type: number
              nullable: true
            review:
              type: string
              nullable: true
            platformId:
              type: number
              default: 0
            source:
              type: string
            addedAt:
              type: string
              nullable: true
          required:
            - userId
            - gameId
            - status
            - rating
            - review
            - platformId
            - source
            - addedAt
      required:
        - message
        - game

    UserGameResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/UserGameWithUserData"
        meta:
          type: object
          properties:
            total:
              type: number
          required:
            - total
      required:
        - results
        - meta

    UserGameWithUserData:
      allOf:
        - $ref: "#/components/schemas/Game"
        - type: object
          properties:
            userGameData:
              $ref: "#/components/schemas/UserGameData"
          required:
            - userGameData

    UserResponse:
      type: object
      properties:
        id:
          type: string
        image:
          type: string
        name:
          type: string
        username:
          type: string
        email:
          type: string
      required:
        - id
        - image
        - name
        - username
        - email

    PublicUserResponse:
      type: object
      properties:
        id:
          type: string
        image:
          type: string
        name:
          type: string
        username:
          type: string
        games:
          type: array
          items:
            type: object
            properties: {}
      required:
        - id
        - image
        - name
        - username
        - games

    UserGameCreateRequest:
      type: object
      properties:
        gameId:
          type: number
        status:
          $ref: "#/components/schemas/StatusEnum"
        rating:
          type: number
          minimum: 0
          maximum: 10
        review:
          type: string
          minLength: 3
          maxLength: 5000
          nullable: true
        platformId:
          type: number
        endedAt:
          type: string
          nullable: true
          description: Date when the game was finished or dropped. Only applicable for games with status 'finished' or 'dropped'.
      required:
        - gameId
        - status
        - rating
        - platformId

    UserGameUpdateRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/StatusEnum"
        rating:
          type: number
          minimum: 0
          maximum: 10
          nullable: true
        review:
          type: string
          nullable: true
        platformId:
          type: number
        endedAt:
          type: string
          nullable: true
          description: Date when the game was finished or dropped. Only applicable for games with status 'finished' or 'dropped'.
      minProperties: 1

    ChatRequest:
      type: object
      description: >-
        Chat history in the AI SDK UI message format (what useChat sends). Only "user" and
        "assistant" messages are accepted; the response is an AI SDK UI message stream (SSE).
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            properties:
              id:
                type: string
              role:
                type: string
                enum:
                  - user
                  - assistant
              parts:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                  required:
                    - type
                  additionalProperties: true
            required:
              - id
              - role
              - parts
        showOnlyGames:
          type: boolean
          default: true
          description: Only return main games, remakes, remasters and expanded games from searches
      required:
        - messages

    GameExportData:
      type: object
      properties:
        gameId:
          type: number
        gameName:
          type: string
        status:
          $ref: "#/components/schemas/StatusEnum"
        rating:
          type: number
          nullable: true
        review:
          type: string
          nullable: true
        platformId:
          type: number
        addedAt:
          type: string
          nullable: true
        endedAt:
          type: string
          nullable: true
        source:
          type: string
      required:
        - gameId
        - gameName
        - status
        - platformId

    GameExportResponse:
      type: object
      properties:
        username:
          type: string
        exportedAt:
          type: string
        totalGames:
          type: number
        games:
          type: array
          items:
            $ref: "#/components/schemas/GameExportData"
      required:
        - username
        - exportedAt
        - totalGames
        - games

    GameImportData:
      type: object
      properties:
        gameId:
          type: number
        status:
          $ref: "#/components/schemas/StatusEnum"
        rating:
          type: number
          minimum: 0
          maximum: 10
          nullable: true
        review:
          type: string
          nullable: true
        platformId:
          type: number
        endedAt:
          type: string
          nullable: true
      required:
        - gameId
        - status
        - platformId

    GameImportRequest:
      type: object
      properties:
        games:
          type: array
          items:
            $ref: "#/components/schemas/GameImportData"
        overwriteExisting:
          type: boolean
          default: false
          description: Whether to overwrite existing games in the library
      required:
        - games

    GameImportResponse:
      type: object
      properties:
        message:
          type: string
        imported:
          type: number
        skipped:
          type: number
        errors:
          type: number
        details:
          type: object
          properties:
            importedGames:
              type: array
              items:
                type: number
            skippedGames:
              type: array
              items:
                type: object
                properties:
                  gameId:
                    type: number
                  reason:
                    type: string
                required:
                  - gameId
                  - reason
            errorGames:
              type: array
              items:
                type: object
                properties:
                  gameId:
                    type: number
                  error:
                    type: string
                required:
                  - gameId
                  - error
          required:
            - importedGames
            - skippedGames
            - errorGames
      required:
        - message
        - imported
        - skipped
        - errors
        - details

paths:
  /api/me:
    get:
      operationId: getApiMe
      tags:
        - User
      summary: Get current authenticated user
      description: Returns info about the currently authenticated user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: User data returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponse"

  /api/user/{username}:
    get:
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      operationId: getApiUserByUsername
      tags:
        - User
      summary: Get a user by username
      description: Returns public info about a user, by their username
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUserResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"

  /api/games:
    get:
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: number
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: number
            default: 0
        - name: platformId
          in: query
          required: false
          schema:
            type: number
            default: 0
        - name: sort
          in: query
          required: false
          description: >-
            id (catalog order, default), popular (IGDB rating count) or recent (released games,
            newest first; unreleased and undated games are left out)
          schema:
            type: string
            enum: [id, popular, recent]
      operationId: getApiGames
      tags:
        - Games
      summary: Get all games
      description: >
        Retrieves a list of games from the catalog. Supports filtering by
        platform and pagination.
      responses:
        "200":
          description: List of games with metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameListResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"

  /api/games/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      operationId: getApiGamesById
      tags:
        - Games
      summary: Get a single game by ID
      description: Retrieves detailed information about a specific game by its ID.
      responses:
        "200":
          description: Game found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          description: Invalid game ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponse"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"

  /api/games/search:
    get:
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 100
          description: Search text; matched against the name and alternative names
        - name: limit
          in: query
          required: false
          schema:
            type: number
            default: 50
            minimum: 1
            maximum: 50
        - name: offset
          in: query
          required: false
          schema:
            type: number
            default: 0
            minimum: 0
        - name: editions
          in: query
          required: false
          schema:
            type: string
            enum: ["1", "true"]
          description: Also return editions (Deluxe, GOTY, ...), hidden by default
        - name: types
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated IGDB game_type ids to keep (0 = Main Game, 1 = DLC, 8 = Remake, ...)
      operationId: getApiGamesSearch
      tags:
        - Games
      summary: Search the catalog
      description: >-
        Local search over the IGDB mirror: substring or trigram word-similarity match on the
        name and alternative names, ranked by similarity, popularity and rating count. Deleted
        games are never returned. Rate limited per client.
      responses:
        "200":
          description: Matching games as light cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameListResponse"
        "400":
          description: Invalid search parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponse"
        "429":
          description: Too many searches from this client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponse"
  /api/user/{username}/games:
    get:
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size (max 1000). Omit to get the whole library.
          schema:
            type: number
        - name: offset
          in: query
          required: false
          schema:
            type: number
      operationId: getApiUserByUsernameGames
      tags:
        - User
      summary: Get all games for a user by username
      description: >
        Retrieves all games in a user's library with their statuses, ratings,
        and reviews
      responses:
        "200":
          description: List of games returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserGameResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"

    post:
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      operationId: postApiUserByUsernameGames
      tags:
        - User
      summary: Add a game to user's library
      description: >
        Adds a game to the authenticated user's library. Username must match the
        authorized user.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Game added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                      - Game added successfully
                  game:
                    type: object
                required:
                  - message
                  - game
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponse"
        "403":
          description: Forbidden — username mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenErrorResponse"
        "409":
          description: Game already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserGameCreateRequest"

  /api/user/{username}/games/{id}:
    patch:
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: number
      operationId: patchApiUserByUsernameGamesById
      tags:
        - User
      summary: Update a game in user's library
      description: Updates game status, rating, review or platform in the authenticated user's library. At least one field must be provided.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Game updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserGamePatchResponse"
        "400":
          description: Invalid input or no fields provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponse"
        "403":
          description: Forbidden — username mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenErrorResponse"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserGameUpdateRequest"

    delete:
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: number
      operationId: deleteApiUserByUsernameGamesById
      tags:
        - User
      summary: Remove a game from user's library
      description: Removes a game from the authenticated user's library by game ID.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Game removed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSuccessResponse"
        "404":
          description: Game not found in library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"

  /api/user/{username}/games/export:
    get:
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum:
              - json
              - csv
            default: json
          description: Export format (json or csv)
        - name: download
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Whether to return as downloadable file with proper headers
      operationId: getApiUserByUsernameGamesExport
      tags:
        - User
      summary: Export user's game library to downloadable file
      description: >
        Exports all games in the authenticated user's library as a downloadable file.
        Backend generates the file with proper Content-Disposition headers for download.
        Supports JSON and CSV formats. Username must match the authorized user.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Games exported successfully as downloadable file
          headers:
            Content-Disposition:
              description: Attachment header for file download
              schema:
                type: string
                example: 'attachment; filename="games-export-2024-01-15.json"'
            Content-Type:
              description: MIME type of the exported file
              schema:
                type: string
                example: "application/json"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameExportResponse"
            text/csv:
              schema:
                type: string
                description: CSV format of the exported games
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: Binary file download
        "403":
          description: Forbidden — username mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"

  /api/user/{username}/games/import:
    post:
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      operationId: postApiUserByUsernameGamesImport
      tags:
        - User
      summary: Import games to user's library from file upload
      description: >
        Imports games to the authenticated user's library from uploaded JSON or CSV file.
        Backend handles file parsing, validation, and processing. Username must match the
        authorized user. Can optionally overwrite existing games.
        Note: endedAt field is only valid for games with status 'finished' or 'dropped'.
        Limits: Maximum 1000 games per import, maximum file size 10MB.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Games imported successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameImportResponse"
        "400":
          description: Bad request - invalid import data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorResponse"
        "403":
          description: Forbidden — username mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameImportRequest"
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: JSON or CSV file containing games to import
                overwriteExisting:
                  type: boolean
                  default: false
                  description: Whether to overwrite existing games in the library

  /api/webhooks/igdb/{entity}/{method}:
    post:
      summary: IGDB webhook receiver
      description: |
        Called by IGDB, not by clients. The librarian registers these URLs with IGDB; IGDB posts
        the changed entity (only its id on delete) with the shared secret in `X-Secret`. The game
        the event is about is queued for a re-fetch.
      operationId: postIgdbWebhook
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
            enum:
              - games
              - covers
              - screenshots
              - videos
              - websites
              - external_games
              - game_localizations
              - involved_companies
        - name: method
          in: path
          required: true
          schema:
            type: string
            enum: [create, update, delete]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                id:
                  type: integer
                game:
                  type: integer
      responses:
        "200":
          description: Event acknowledged (gameId is null when it could not be resolved)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  gameId:
                    type: integer
                    nullable: true
                required:
                  - ok
                  - gameId
        "403":
          description: Bad or missing X-Secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenErrorResponse"
        "404":
          description: Webhooks are not configured on this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"

  /api/chat/ai:
    post:
      operationId: postApiChatAi
      tags:
        - Chat
      summary: Stream AI chat with game assistant
      description: Uses OpenAI + function calling via ai-sdk
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Streamed assistant response (SSE)
          content:
            text/event-stream: {}
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponse"
        "500":
          description: AI service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
