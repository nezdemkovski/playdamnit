        - Games
      summary: Site-wide review feed
      parameters:
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [latest, top]
        - name: limit
          in: query
          required: false
          schema:
            type: number
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: number
            default: 0
        - name: following
          in: query
          required: false
          description: Any value keeps only people the viewer follows
          schema:
            type: string
      responses:
        "200":
          description: Reviews with their games
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResponse"

  /api/reviews/{id}/reaction:
    put:
      operationId: putApiReviewsByIdReaction
      tags:
        - Games
      summary: React to a review with an emoji (replaces a previous reaction)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emoji:
                  type: string
                  enum: ["❤️", "🔥", "👏", "😂", "🤔", "😢", "💀", "👀"]
                  x-enumNames: [Heart, Fire, Clap, Laugh, Thinking, Sad, Skull, Eyes]
              required:
                - emoji
      responses:
        "200":
          description: Reacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionResponse"
        "403":
          description: The author turned reactions off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenErrorResponse"
    delete:
      operationId: deleteApiReviewsByIdReaction
      tags:
        - Games
      summary: Remove the reaction
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionResponse"

  /api/lists/{id}:
    get:
      operationId: getApiListsById
      tags:
        - Lists
      summary: A list with its games in order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameListDetail"
        "404":
          description: Not found (or private)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
    patch:
      operationId: patchApiListsById
      tags:
        - Lists
      summary: Rename, describe or hide a list
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameListInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameListSummary"
    delete:
      operationId: deleteApiListsById
      tags:
        - Lists
      summary: Delete a list
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id:
                    type: string
                required:
                  - message
                  - id

  /api/lists/{id}/games:
    put:
      operationId: putApiListsByIdGames
      tags:
        - Lists
      summary: Replace the list's games with this ordered set
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gameIds:
                  type: array
                  items:
                    type: number
              required:
                - gameIds
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: number
                required:
                  - count
    post:
      operationId: postApiListsByIdGames
      tags:
        - Lists
      summary: Append a game
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gameId:
                  type: number
              required:
                - gameId
      responses:
        "200":
          description: Added
          content:
            application/json:
              schema:
                type: object
                properties:
                  added:
                    type: boolean
                required:
                  - added

  /api/lists/{id}/games/{gameId}:
    delete:
      operationId: deleteApiListsByIdGamesByGameId
