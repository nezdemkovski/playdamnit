openapi: 3.0.3
info:
  title: Your API
  description: Development documentation
  version: 1.0.0
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token

  schemas:
    ContentKind:
      type: string
      enum: [user, review, list]
      x-enumNames: [User, Review, List]
    ReportReason:
      type: string
      enum: [abuse, hate, sexual, spam, other]
      x-enumNames: [Abuse, Hate, Sexual, Spam, Other]
    ModerationAction:
      type: string
      enum: [dismissed, removed, banned]
      x-enumNames: [Dismissed, Removed, Banned]
    ReportStatus:
      type: string
      enum: [pending, dismissed, removed, banned]
      x-enumNames: [Pending, Dismissed, Removed, Banned]
    SuspendedUser:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        username: { type: string, nullable: true }
        image: { type: string, nullable: true }
        banReason: { type: string, nullable: true }
        banExpires: { type: string, nullable: true }
    SafetyReportInput:
      type: object
      required: [kind, targetId, reason]
      properties:
        kind: { $ref: "#/components/schemas/ContentKind" }
        targetId: { type: string }
        reason: { $ref: "#/components/schemas/ReportReason" }
    BlockedUser:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        username: { type: string, nullable: true }
        image: { type: string, nullable: true }
    ModerationReport:
      type: object
      required: [id, kind, targetId, reason, context, status, createdAt]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/ContentKind" }
        targetId: { type: string }
        reason: { $ref: "#/components/schemas/ReportReason" }
        context: { type: string }
        subjectId: { type: string, nullable: true }
        reporterId: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/ReportStatus" }
        subject:
          allOf: [{ $ref: "#/components/schemas/BlockedUser" }]
          nullable: true
        reporter:
          allOf: [{ $ref: "#/components/schemas/BlockedUser" }]
          nullable: true
        resolver:
          allOf: [{ $ref: "#/components/schemas/BlockedUser" }]
          nullable: true
        createdAt: { type: string }
        resolvedAt: { type: string, nullable: true }
        resolvedBy: { type: string, nullable: true }
    SafetySuccess:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    BadRequestErrorResponse:
      description: 400 Bad request
      type: object
      properties:
        error:
          type: string
      required:
        - error

    UnauthorizedErrorResponse:
      description: 401 Unauthorized
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    ForbiddenErrorResponse:
      description: 403 Forbidden
      type: object
      properties:
        error:
          type: string
        message:
          type: string
          description: Human readable error message
      required:
        - error

    NotFoundErrorResponse:
      description: 404 Not found
      type: object
      properties:
        error:
          type: string
        message:
          type: string
          description: Human readable error message
      required:
        - error

    ConflictErrorResponse:
      description: 409 Conflict
      type: object
      properties:
        error:
          type: string
        message:
          type: string
          description: Human readable error message
      required:
        - error

    TooManyRequestsErrorResponse:
      description: 429 Too Many Requests (the Retry-After header says when to try again)
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    InternalServerErrorResponse:
      description: 500 Internal server error
      type: object
      properties:
        error:
          type: string
        message:
          type: string
          description: Human readable error message
      required:
        - error

    ChatRole:
      type: string
      enum:
        - user
        - assistant
        - system
        - function

    UserGameDeleteResponse:
      allOf:
        - $ref: "#/components/schemas/DeleteSuccessResponse"
        - type: object
          properties:
            community:
              $ref: "#/components/schemas/GameCommunity"

    DeleteSuccessResponse:
      type: object
      properties:
        message:
          type: string
          enum:
            - Removed successfully
        id:
          type: number
      required:
        - message
        - id

    GameCover:
      type: object
      properties:
        id:
          type: number
        url:
          type: string
          nullable: true
        width:
          type: number
          nullable: true
        height:
          type: number
          nullable: true
      description: "A game without a cover comes back as { url: null }, without an id"
      required:
        - url

    GameGenre:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        slug:
          type: string
      required:
        - id
        - name
        - slug

    GameListResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/Game"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - results
        - meta

    GamePlatform:
      type: object
      description: A platform from the IGDB catalog; `id` is the IGDB platform id.
      properties:
        id:
          type: number
        name:
          type: string
        slug:
          type: string
        abbreviation:
          type: string
          nullable: true
      required:
        - id
        - name
        - slug

    Game:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        slug:
          type: string
        summary:
          type: string
          nullable: true
        storyline:
          type: string
          nullable: true
        firstReleaseDate:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        totalRating:
          type: number
          nullable: true
        grade:
          description: The catalog score's grade; null without a score
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Grade"
        updatedAt:
          type: string
          format: date-time
          nullable: true
        isPopular:
          type: boolean
        cover:
          $ref: "#/components/schemas/GameCover"
        screenshots:
          type: array
          description: Only present on GET /api/games/{id}
          items:
            $ref: "#/components/schemas/GameScreenshot"
        websites:
          type: array
          items:
            $ref: "#/components/schemas/GameWebsite"
        platforms:
          type: array
          items:
            $ref: "#/components/schemas/GamePlatform"
        genres:
          type: array
          items:
            $ref: "#/components/schemas/GameGenre"
        types:
          type: array
          items:
            $ref: "#/components/schemas/GameType"
        similarGames:
          type: array
          description: Only present on GET /api/games/{id}; cards of IGDB's similar games
          items:
            $ref: "#/components/schemas/GameRelated"
        community:
          description: Only present on GET /api/games/{id}; what members did with the game
          allOf:
            - $ref: "#/components/schemas/GameCommunity"
        viewer:
          description: Only present on GET /api/games/{id}
          type: object
          properties:
            liked:
              type: boolean
          required:
            - liked
        totalRatingCount:
          type: number
          nullable: true
        firstReleaseDatePrecision:
          type: string
          nullable: true
          enum: [day, month, year, quarter, tbd, null]
          description: How precise the release date is
        gameType:
          type: number
          nullable: true
          description: IGDB game_type id (0 = Main Game, 1 = DLC, 8 = Remake, 9 = Remaster, ...)
        parentGameId:
          type: number
          nullable: true
          description: For DLC, expansions, updates and bundles, the game they belong to
        versionParentId:
          type: number
          nullable: true
          description: For editions (Deluxe, GOTY, ...), the game they are a version of
        alternativeNames:
          type: array
          items:
            type: string
        deleted:
          type: boolean
          description: IGDB no longer has this game; it stays because libraries reference it
        developers:
          type: array
          description: Only present on GET /api/games/{id}
          items:
            $ref: "#/components/schemas/GameCompany"
        publishers:
          type: array
          description: Only present on GET /api/games/{id}
          items:
            $ref: "#/components/schemas/GameCompany"
        videos:
          type: array
          description: Only present on GET /api/games/{id}
          items:
            $ref: "#/components/schemas/GameVideo"
        externalGames:
          type: array
          description: Only present on GET /api/games/{id}; store and service listings
          items:
            $ref: "#/components/schemas/GameExternalGame"
        collections:
          type: array
          description: Only present on GET /api/games/{id}; series the game belongs to
          items:
            $ref: "#/components/schemas/GameNamed"
        themes:
          type: array
          description: Only present on GET /api/games/{id}
          items:
            $ref: "#/components/schemas/GameNamed"
        gameModes:
          type: array
          description: Only present on GET /api/games/{id}
          items:
            $ref: "#/components/schemas/GameNamed"
        timeToBeat:
          description: Only present on GET /api/games/{id}; seconds
          nullable: true
          allOf:
            - $ref: "#/components/schemas/GameTimeToBeat"
        localizedCovers:
          type: array
          description: Only present on GET /api/games/{id}
          items:
            $ref: "#/components/schemas/GameLocalizedCover"
        children:
          type: array
          description: Only present on GET /api/games/{id}; DLC, expansions, updates, bundles
          items:
            $ref: "#/components/schemas/GameRelated"
        editions:
          type: array
          description: Only present on GET /api/games/{id}; Deluxe / GOTY / regional versions
          items:
            $ref: "#/components/schemas/GameRelated"
      required:
        - id
        - name
        - slug
        - isPopular
        - cover
        - platforms
        - genres
        - types
        - alternativeNames
        - deleted
      description: >-
        screenshots, websites, similarGames, developers, publishers, videos, externalGames,
        collections, themes, gameModes, timeToBeat, localizedCovers, children and editions are
        only included by GET /api/games/{id}; list endpoints (search, catalog, library) omit
        them. Search hides deleted games and editions unless asked for.

    GameNamed:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        slug:
          type: string
      required:
        - id
        - name
        - slug

    GameCompany:
      $ref: "#/components/schemas/GameNamed"

    GameVideo:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
          nullable: true
        videoId:
          type: string
          description: YouTube video id
        url:
          type: string
      required:
        - id
        - videoId
        - url

    GameExternalGame:
      type: object
      properties:
        id:
          type: number
        source:
          type: string
          nullable: true
          description: Steam, GOG, Epic Games Store, ...
        name:
          type: string
          nullable: true
        uid:
          type: string
          nullable: true
          description: The game's id in that store
        url:
          type: string
          nullable: true
      required:
        - id

    GameTimeToBeat:
      type: object
      properties:
        hastily:
          type: number
          nullable: true
        normally:
          type: number
          nullable: true
        completely:
          type: number
          nullable: true
        count:
          type: number
          nullable: true

    GameLocalizedCover:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
          nullable: true
        regionId:
          type: number
          nullable: true
        url:
          type: string
        width:
          type: number
          nullable: true
        height:
          type: number
          nullable: true
      required:
        - id
        - url

    GameRelated:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        slug:
          type: string
        gameType:
          type: number
          nullable: true
        firstReleaseDate:
          type: number
          nullable: true
        cover:
          $ref: "#/components/schemas/GameCover"
      required:
        - id
        - name
        - slug
        - cover

    GameScreenshot:
      type: object
      properties:
        id:
          type: number
        url:
          type: string
          nullable: true
        width:
          type: number
          nullable: true
        height:
          type: number
          nullable: true
      required:
        - id
        - url

    GameCommunity:
      type: object
      properties:
        total:
          type: number
          description: Members with the game in their list
        statuses:
          type: object
          additionalProperties:
            type: number
          description: Count per status
        mastered:
          type: number
        ratingAverage:
          type: number
          nullable: true
        grade:
          description: The members' grade (of the average); null before anyone grades it
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Grade"
        ratingCount:
          type: number
        histogram:
          type: array
          description: Ratings bucketed by whole number (floor), 1..10
          items:
            type: number
        gradeCounts:
          $ref: "#/components/schemas/GradeCounts"
        reviews:
          type: number
        likes:
          type: number
        lists:
          type: number
          description: Public lists containing the game
      required:
        - total
        - statuses
        - mastered
        - ratingAverage
        - grade
        - ratingCount
        - histogram
        - gradeCounts
        - reviews
        - likes
        - lists

    PublicUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
          nullable: true
        name:
          type: string
        image:
          type: string
          nullable: true
      required:
        - id
        - username
        - name
        - image

    Review:
      type: object
      description: A library entry with text; `id` is the entry id used for likes
      properties:
        id:
          type: string
        gameId:
          type: number
        user:
          $ref: "#/components/schemas/PublicUser"
        rating:
          type: number
          nullable: true
        grade:
          description: The rating's grade; null when not graded
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Grade"
        status:
          $ref: "#/components/schemas/StatusEnum"
        mastered:
          type: boolean
        spoilers:
          type: boolean
        review:
          type: string
        platformId:
          type: number
          nullable: true
        endedAt:
          type: string
          nullable: true
        addedAt:
          type: string
        updatedAt:
          type: string
        allowReactions:
          type: boolean
        likes:
          type: number
          description: Total reactions
        reactions:
          type: array
          description: Per-emoji counts, most used first
          items:
            type: object
            properties:
              emoji:
                type: string
              count:
                type: number
            required:
              - emoji
              - count
        myReaction:
          type: string
          nullable: true
          description: The viewer's own emoji on this review
        game:
          description: Present on feeds (not on a game's own reviews)
          allOf:
            - $ref: "#/components/schemas/Game"
      required:
        - id
        - gameId
        - user
        - rating
        - grade
        - status
        - mastered
        - spoilers
        - review
        - platformId
        - endedAt
        - addedAt
        - updatedAt
        - allowReactions
        - likes
        - reactions
        - myReaction

    ReviewListResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - results
        - meta

    LikeResponse:
      type: object
      properties:
        liked:
          type: boolean
      required:
        - liked

    ReactionResponse:
      type: object
      properties:
        reaction:
          type: string
          nullable: true
      required:
        - reaction

    FollowResponse:
      type: object
      properties:
        following:
          type: boolean
      required:
        - following

    CommunityUser:
      allOf:
        - $ref: "#/components/schemas/PublicUser"
        - type: object
          properties:
            bio:
              type: string
              nullable: true
            gamesCount:
              type: number
            followersCount:
              type: number
            isFollowing:
              type: boolean
          required:
            - gamesCount
            - followersCount
            - isFollowing

    CommunityUserListResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/CommunityUser"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - results
        - meta

    TasteMatch:
      allOf:
        - $ref: "#/components/schemas/PublicUser"
        - type: object
          properties:
            isFollowing:
              type: boolean
            shared:
              type: number
              description: Games both members graded
            agreement:
              type: number
              description: How close their grades are on those games, 0 to 100
            games:
              type: array
              description: Up to three shared games, the ones both graded highest
              items:
                $ref: "#/components/schemas/Game"
          required:
            - isFollowing
            - shared
            - agreement
            - games

    ConnectionUser:
      allOf:
        - $ref: "#/components/schemas/PublicUser"
        - type: object
          properties:
            isFollowing:
              type: boolean
          required:
            - isFollowing

    ConnectionListResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ConnectionUser"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - results
        - meta

    ProfileUpdateRequest:
      type: object
      properties:
        bio:
          type: string
          nullable: true
          maxLength: 300
        links:
          type: array
          maxItems: 5
          items:
            type: string
        listPublic:
          type: boolean

    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [follow, review_reaction]
        actor:
          $ref: "#/components/schemas/PublicUser"
        game:
          nullable: true
          type: object
          properties:
            id:
              type: number
            name:
              type: string
            slug:
              type: string
            cover:
              $ref: "#/components/schemas/GameCover"
          required:
            - id
            - name
            - slug
            - cover
        emoji:
          type: string
          nullable: true
        readAt:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - type
        - actor
        - game
        - emoji
        - readAt
        - createdAt

    NotificationListResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        unread:
          type: number
      required:
        - results
        - unread

    FeedItem:
      type: object
      description: A list entry a followed member added or changed
      properties:
        id:
          type: string
        user:
          $ref: "#/components/schemas/PublicUser"
        game:
          $ref: "#/components/schemas/Game"
        status:
          $ref: "#/components/schemas/StatusEnum"
        rating:
          type: number
          nullable: true
        grade:
          description: The rating's grade; null when not graded
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Grade"
        mastered:
          type: boolean
        hasReview:
          type: boolean
        at:
          type: string
        isNew:
          type: boolean
          description: Added rather than changed
      required:
        - id
        - user
        - game
        - status
        - rating
        - grade
        - mastered
        - hasReview
        - at
        - isNew

    HomeResponse:
      type: object
      properties:
        trending:
          type: array
          items:
            $ref: "#/components/schemas/Game"
        newReleases:
          type: array
          items:
            $ref: "#/components/schemas/Game"
        thisWeek:
          type: array
          description: Today and the six days after, as UTC days, empty days included
          items:
            $ref: "#/components/schemas/HomeWeekDay"
        bestOfYear:
          $ref: "#/components/schemas/HomeBestOfYear"
        freshReviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        feed:
          type: array
          nullable: true
          description: The friends feed; null for a guest
          items:
            $ref: "#/components/schemas/FeedItem"
        forYou:
          type: array
          nullable: true
          description: Picks for the viewer; null for a guest
          items:
            $ref: "#/components/schemas/Game"
        tasteMatches:
          type: array
          nullable: true
          description: Members with the viewer's taste, closest first; null for a guest
          items:
            $ref: "#/components/schemas/TasteMatch"
      required:
        - trending
        - newReleases
        - thisWeek
        - bestOfYear
        - freshReviews
        - feed
        - forYou
        - tasteMatches

    HomeBestOfYear:
      type: object
      description: The best-rated games released this UTC year
      properties:
        year:
          type: integer
        games:
          type: array
          items:
            $ref: "#/components/schemas/Game"
      required:
        - year
        - games

    HomeWeekDay:
      type: object
      properties:
        date:
          type: string
          description: The UTC day, YYYY-MM-DD
        count:
          type: integer
          description: Games released on the day
        games:
          type: array
          description: The day's most popular releases, games with a cover first
          items:
            $ref: "#/components/schemas/Game"
      required:
        - date
        - count
        - games

    FeedResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/FeedItem"
      required:
        - results

    Playthrough:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        gameId:
          type: number
        startedAt:
          type: string
          nullable: true
          description: YYYY-MM-DD
        endedAt:
          type: string
          nullable: true
          description: YYYY-MM-DD
        hours:
          type: number
          nullable: true
        platformId:
          type: number
          nullable: true
        platform:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/GamePlatform"
        note:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - userId
        - gameId
        - startedAt
        - endedAt
        - hours
        - platformId
        - note
        - createdAt

    PlaythroughInput:
      type: object
      properties:
        startedAt:
          type: string
          nullable: true
        endedAt:
          type: string
          nullable: true
        hours:
          type: number
          nullable: true
        platformId:
          type: number
          nullable: true
        note:
          type: string
          nullable: true

    JournalItem:
      type: object
      description: A playthrough, or a finished/dropped entry that has no playthrough logged
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [playthrough, entry]
        date:
          type: string
          description: YYYY-MM-DD, what the journal is ordered by
        startedAt:
          type: string
          nullable: true
        endedAt:
          type: string
          nullable: true
        hours:
          type: number
          nullable: true
        platform:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/GamePlatform"
        note:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/StatusEnum"
        rating:
          type: number
          nullable: true
        grade:
          description: The rating's grade; null when not graded
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Grade"
        mastered:
          type: boolean
        game:
          $ref: "#/components/schemas/Game"
      required:
        - id
        - kind
        - date
        - startedAt
        - endedAt
        - hours
        - platform
        - note
        - game

    JournalResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/JournalItem"
        private:
