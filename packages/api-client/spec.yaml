        - name: gameId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  added:
                    type: boolean
                required:
                  - added

  /api/chat/ai:
    post:
      operationId: postApiChatAi
      tags:
        - Chat
      summary: Stream AI chat with game assistant
      description: Uses OpenAI + function calling via ai-sdk
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Streamed assistant response (SSE)
          content:
            text/event-stream: {}
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponse"
        "500":
          description: AI service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
