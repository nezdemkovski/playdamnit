paths:
  /api/me/reports:
    post:
      operationId: postApiMeReports
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafetyReportInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetySuccess"
        "401":
          description: Authentication required
        "403":
          description: Forbidden
  /api/me/blocks:
    get:
      operationId: getApiMeBlocks
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BlockedUser" }
        "401":
          description: Authentication required
        "403":
          description: Forbidden
  /api/me/blocks/{id}:
    put:
      operationId: putApiMeBlocksById
      security: [{ cookieAuth: [] }]
