          schema:
            type: number
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: number
            default: 0
        - name: platformId
          in: query
          required: false
          schema:
            type: number
            default: 0
        - name: genreId
          in: query
          required: false
          schema:
            type: number
        - name: year
          in: query
          required: false
          description: Release year
          schema:
            type: number
        - name: releasedFrom
          in: query
          required: false
          description: Unix seconds, inclusive
          schema:
            type: number
        - name: releasedTo
          in: query
          required: false
          description: Unix seconds, inclusive
          schema:
            type: number
        - name: types
          in: query
          required: false
          description: Comma-separated IGDB game_type ids to keep
          schema:
            type: string
        - name: ids
          in: query
          required: false
          description: Comma-separated game ids; results come back in catalog order
          schema:
            type: string
        - name: popular
          in: query
          required: false
          description: '"1" or "true" keeps only hot games: 100+ IGDB ratings, or 10+ follows before release'
          schema:
            type: string
        - name: mine
          in: query
          required: false
          description: '"1" or "true" keeps only games in the signed-in viewer''s library (401 without a session)'
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: >-
            id (catalog order, default), popular (IGDB rating count), rating (IGDB rating, games
            with enough votes), recent (released games with a cover, newest first), upcoming
            (unreleased games with a cover, soonest first), wanted (most wanted/backlogged by
            members), played (most members) or date (release calendar: dated games with a
            cover in date order, combine with releasedFrom/releasedTo)
          schema:
            type: string
            enum: [id, popular, rating, recent, upcoming, wanted, played, date]
      operationId: getApiGames
      tags:
        - Games
      summary: Get all games
      description: >
        Retrieves a list of games from the catalog. Supports filtering by
        platform and pagination.
      responses:
        "200":
          description: List of games with metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameListResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"

  /api/me/sign-in:
    get:
      operationId: getApiMeSignIn
      tags:
        - Me
      summary: Sign-in methods
      description: How the signed-in member can sign in, for settings. Apple can be unlinked only while another linked account remains (passkeys do not count).
      responses:
        "200":
          description: The methods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInMethods"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponse"

  /api/me/password:
    post:
      operationId: postApiMePassword
      tags:
        - Me
      summary: Set a first password
      description: For an account made with Apple that has no password yet; refused when one is set (change it with Better Auth's change-password).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 128
              required:
                - newPassword
      responses:
        "200":
          description: Set
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                required:
                  - status
        "400":
          description: A password is already set, or it is too short
