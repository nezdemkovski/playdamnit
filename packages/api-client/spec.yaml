  /api/user/{username}/activity:
    get:
      operationId: getApiUserByUsernameActivity
      tags:
        - Library
      summary: The activity map
      description: >-
        Every day of the last `days` (counted in `tz`) on which the member added, finished,
        dropped or edited a game or played one on Steam, with the first few games of each action
        and a level 1-4 to colour the cell by (quartiles of the active days' scores). Days with
        nothing are left out, so clients draw them empty. Private lists are owner-only.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: days
          in: query
          required: false
          description: Days back from today, today included
          schema:
            type: integer
            minimum: 1
            maximum: 366
            default: 364
        - name: tz
          in: query
          required: false
          description: IANA time zone the days are counted in (the viewer's own); unknown zones count in UTC
          schema:
            type: string
      responses:
        "200":
          description: The active days, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityResponse"
        "403":
          description: The list is private
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"

