server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;

  # API compatibility is handled by the tunnel; shared web links use the canonical domain.
  if ($host = games.nezdemkovski.cloud) {
    return 308 https://playdamnit.com$request_uri;
  }
  if ($host = www.playdamnit.com) {
    return 308 https://playdamnit.com$request_uri;
  }

  # Hashed build assets never change
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The iOS app's shared web credentials (password managers, passkeys); Apple wants JSON
  location = /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Client-side routing: unknown paths get the SPA shell
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
