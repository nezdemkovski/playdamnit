name: CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_USER: playdamnit
          POSTGRES_PASSWORD: playdamnit
          POSTGRES_DB: playdamnit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U playdamnit -d playdamnit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://playdamnit:playdamnit@localhost:5432/playdamnit_test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check migrations match the schema
        run: bun run --cwd packages/db db:check

      - name: Typecheck, test and build
        run: bunx turbo run typecheck test build
