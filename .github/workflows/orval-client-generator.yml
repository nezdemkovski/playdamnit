name: Generate and Publish API Client

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      # Not package.json: the version bump commit below must not retrigger this workflow
      - "packages/api-client/spec.yaml"
      - "packages/api-client/custom-axios.ts"
      - "packages/api-client/index.ts"
      - "packages/api-client/orval.config.mjs"
  pull_request:
    paths:
      # Not package.json: the version bump commit below must not retrigger this workflow
      - "packages/api-client/spec.yaml"
      - "packages/api-client/custom-axios.ts"
      - "packages/api-client/index.ts"
      - "packages/api-client/orval.config.mjs"

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate and build the client
        run: bunx turbo run build --filter=@playdamnit/api-client

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Bump patch version
        id: package-version
        working-directory: packages/api-client
        # Not `npm version`: inside a Bun workspace it chokes on the `workspace:` protocol
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const [major, minor, patch] = pkg.version.split(".").map(Number);
            pkg.version = `${major}.${minor}.${patch + 1}`;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        working-directory: packages/api-client
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version update
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add packages/api-client/package.json
          git commit -m "chore: bump api client version to ${{ steps.package-version.outputs.version }}" || exit 0
          git push
