# Local development database. Apps run on the host: `bun run db:up && bun run dev`.
services:
  postgres:
    image: postgres:18.6-alpine
    container_name: playdamnit-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-playdamnit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-playdamnit}
      POSTGRES_DB: ${POSTGRES_DB:-playdamnit}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
    name: playdamnit-postgres-data-dev
